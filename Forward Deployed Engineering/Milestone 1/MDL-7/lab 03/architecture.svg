ks for secrets and unsafe code</text><rect x="915" y="285" width="340" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1085.0" y="317" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Test Generation Agent</text><text x="1085.0" y="344" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Proposes missing unit tests</text><path d="M235 363 V406 H660" stroke="#365e70" stroke-width="2.4" fill="none" /><path d="M1085 363 V406 H660" stroke="#365e70" stroke-width="2.4" fill="none" /><path d="M660 363 V450" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="455" y="450" width="410" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="660.0" y="482" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Deterministic aggregator</text><text x="660.0" y="509" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Applies policy rules to worker results</text><rect x="65" y="450" width="325" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="227.5" y="482" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">CI policy</text><text x="227.5" y="509" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">config/ci_policy.json</text><path d="M390 489 H455" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M660 528 V570" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="455" y="570" width="410" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="660.0" y="602" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="mid