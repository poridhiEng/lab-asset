<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="934" viewBox="0 0 1320 934"><title>Quality engineering pipeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365e70"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="42" y="28" width="295" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="189.5" y="60" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">GitHub Actions</text><text x="189.5" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">quality-gate.yml</text><rect x="480" y="28" width="385" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="672.5" y="60" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Quality pipeline</text><text x="672.5" y="87" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">scripts/quality_pipeline.py</text><path d="M337 67 H480" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M672 106 V145" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="42" y="145" width="320" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="202.0" y="177" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Feature spec and source</text><text x="202.0" y="204" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">feature_spec.md + order_pricing.py</text><rect x="480" y="145" width="385" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="672.5" y="177" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Test Planning Agent</text><text x="672.5" y="204" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Defines test cases, risks and priorities</text><path d="M362 184 H480" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M672 223 V268" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="480" y="268" width="385" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="672.5" y="300" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Test Generation Agent</text><text x="672.5" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Writes a pytest suite to generated_tests/</text><path d="M672 346 V391" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="480" y="391" width="385" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="672.5" y="423" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Validate generated suite</text><text x="672.5" y="450" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Check syntax, test names and imports</text><rect x="42" y="391" width="295" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="189.5" y="423" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Stop generation</text><text x="189.5" y="450" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Report the invalid suite</text><path d="M480 430 H337" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="408" y="419" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Invalid</text><path d="M672 469 V524" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="708" y="503" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Valid</text><rect x="480" y="524" width="385" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="672.5" y="556" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Test executor</text><text x="672.5" y="583" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Runs pytest against .sandbox/src/</text><rect x="980" y="524" width="300" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1130.0" y="556" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Failure Analysis Agent</text><text x="1130.0" y="583" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Diagnoses failed tests</text><path d="M865 563 H980" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="922" y="550" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Failed</text><path d="M1130 602 V645" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="980" y="645" width="300" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1130.0" y="677" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Fix Agent</text><text x="1130.0" y="704" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Proposes a unified diff</text><rect x="980" y="775" width="300" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1130.0" y="807" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Apply sandbox patch</text><text x="1130.0" y="834" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Verify the production source hash</text><path d="M1130 723 V775" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="1144" y="752" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="start">Budget available</text><path d="M1280 814 H1301 V491 H813 V524" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="1050" y="480" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Re-run patched copy</text><rect x="465" y="665" width="400" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="665.0" y="697" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Quality gate</text><text x="665.0" y="724" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Checks test results, suite size and policy</text><path d="M632 602 V665" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="617" y="638" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="end">All passed</text><path d="M980 699 H865" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="922" y="676" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#193b4a" text-anchor="middle">Budget</text><text x="922" y="693" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#193b4a" text-anchor="middle">exhausted</text><rect x="42" y="665" width="310" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="197.0" y="697" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Quality policy</text><text x="197.0" y="724" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">config/quality_policy.json</text><path d="M352 704 H465" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M980 814 H892 V753 H813 V743" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="921" y="801" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Patch failed</text><path d="M665 743 V813" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="465" y="813" width="400" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="665.0" y="845" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">PASSED or BLOCKED</text><text x="665.0" y="872" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">quality_report.json</text></svg>