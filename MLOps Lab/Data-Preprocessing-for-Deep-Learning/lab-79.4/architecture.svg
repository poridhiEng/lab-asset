<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#334155">Poridhi VM  ·  Docker image dl-parity:1.0</text>

  <!-- shared module -->
  <rect x="380" y="70" width="240" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="98" font-size="15" font-weight="700" text-anchor="middle" fill="#5b21b6">preprocess.py</text>
  <text x="500" y="120" font-size="12" text-anchor="middle" fill="#334155">check_input · transform</text>
  <text x="500" y="138" font-size="12" text-anchor="middle" fill="#334155">fit_stats · transform_hash</text>
  <text x="500" y="156" font-size="12" text-anchor="middle" fill="#334155">build_spec · verify_spec</text>

  <!-- training -->
  <rect x="60" y="230" width="250" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="185" y="258" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">train.py</text>
  <text x="185" y="280" font-size="12" text-anchor="middle" fill="#334155">digits 8×8 → fit stats on train split</text>
  <text x="185" y="298" font-size="12" text-anchor="middle" fill="#334155">transform → LogisticRegression</text>
  <text x="185" y="316" font-size="12" text-anchor="middle" fill="#334155">writes model + contract</text>

  <!-- artifacts -->
  <rect x="380" y="250" width="240" height="90" rx="12" fill="#fff" stroke="#475569"/>
  <text x="500" y="276" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">artifacts/</text>
  <text x="500" y="298" font-size="12" text-anchor="middle" fill="#334155">model.joblib</text>
  <text x="500" y="316" font-size="12" text-anchor="middle" fill="#334155">preprocess_spec.json (schema, stats, hash)</text>

  <!-- server -->
  <rect x="690" y="230" width="250" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="815" y="258" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">server.py  (FastAPI)</text>
  <text x="815" y="280" font-size="12" text-anchor="middle" fill="#334155">startup: verify_spec → OK or exit 1</text>
  <text x="815" y="298" font-size="12" text-anchor="middle" fill="#334155">Pydantic: 8×8 pixels, 0..16 → else 422</text>
  <text x="815" y="316" font-size="12" text-anchor="middle" fill="#334155">/health · /features · /predict</text>

  <!-- arrows -->
  <path d="M440,180 L250,230" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M560,180 L750,230" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="300" y="196" font-size="12" fill="#5b21b6">import</text>
  <text x="660" y="196" font-size="12" fill="#5b21b6">import</text>
  <path d="M310,295 L380,295" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,295 L690,295" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- parity -->
  <rect x="60" y="400" width="880" height="110" rx="12" fill="#fee2e2" stroke="#dc2626"/>
  <text x="500" y="428" font-size="15" font-weight="700" text-anchor="middle" fill="#991b1b">check_parity.py</text>
  <text x="500" y="452" font-size="12" text-anchor="middle" fill="#334155">same 360 test digits → training path (preprocess.transform) and serving path (POST /features over HTTP)</text>
  <text x="500" y="472" font-size="12" text-anchor="middle" fill="#334155">compare SHA-256 of the feature bytes · compare accuracy · show a hand-copied "skewed" transform</text>
  <path d="M185,340 L185,400" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M815,340 L815,400" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
