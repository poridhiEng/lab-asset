<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830"><title>Agent-powered CI architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365e70"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="35" y="25" width="320" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="195.0" y="57" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">GitHub Actions</text><text x="195.0" y="84" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Pull request triggers agentic-ci.yml</text><rect x="475" y="25" width="370" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="660.0" y="57" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">CI worker runner</text><text x="660.0" y="84" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">scripts/ci_workers.py</text><rect x="965" y="25" width="320" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1125.0" y="57" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Source under review</text><text x="1125.0" y="84" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">sample_src/payments.py</text><path d="M355 64 H475" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M965 64 H845" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M660 103 V145" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="475" y="145" width="370" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-widt