<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="940" viewBox="0 0 1320 940"><title>Commit-to-deployment pipeline</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#365e70"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="25" width="315" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="197.5" y="57" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Commit and CI results</text><text x="197.5" y="84" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">commit.json + stage_results.json</text><rect x="445" y="25" width="365" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="57" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Router / Triage Agent</text><text x="627.5" y="84" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Selects specialists for this commit</text><path d="M355 64 H445" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M627 103 V148" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="148" width="365" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="180" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Pipeline orchestrator</text><text x="627.5" y="207" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">scripts/pipeline.py</text><rect x="930" y="148" width="350" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1105.0" y="180" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Autonomy policy</text><text x="1105.0" y="207" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Manual, guarded or autonomous</text><path d="M930 187 H810" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M627 226 V270" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="40" y="270" width="770" height="139" rx="12" fill="#f4f9f9" stroke="#7798a5" stroke-width="1.6"/><text x="64" y="304" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="start">Selected specialists run in parallel</text><rect x="60" y="325" width="233" height="65" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="176" y="352" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#193b4a" text-anchor="middle">Build Agent</text><text x="176" y="377" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Build artifact</text><rect x="308" y="325" width="233" height="65" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="424" y="352" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#193b4a" text-anchor="middle">Test Agent</text><text x="424" y="377" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Test results</text><rect x="556" y="325" width="233" height="65" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="672" y="352" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#193b4a" text-anchor="middle">Security Agent</text><text x="672" y="377" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Scan findings</text><path d="M627 409 V462" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="445" y="462" width="365" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="494" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Stage verdicts</text><text x="627.5" y="521" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Collect the latest specialist results</text><rect x="930" y="462" width="350" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1105.0" y="494" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Failure Analysis Agent</text><text x="1105.0" y="521" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Diagnoses the failure and plans recovery</text><path d="M810 501 H930" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="870" y="489" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Failed</text><rect x="930" y="286" width="350" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1105.0" y="318" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Stage state overlay</text><text x="1105.0" y="345" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Applies the permitted recovery plan</text><path d="M1105 462 V364" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="1120" y="418" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="start">Retry permitted</text><path d="M930 327 H810" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="870" y="299" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Re-run</text><text x="870" y="317" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">selected</text><path d="M627 540 V613" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="641" y="580" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="start">No blocking failures</text><rect x="435" y="613" width="385" height="78" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="645" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Production approval gate</text><text x="627.5" y="672" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Checks approval record or policy risk limit</text><rect x="40" y="613" width="312" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="196.0" y="645" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Human approval</text><text x="196.0" y="672" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">approvals.json</text><path d="M352 652 H435" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><rect x="930" y="741" width="350" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="1105.0" y="773" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">FAILED</text><text x="1105.0" y="800" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Blocking stage failure remains</text><path d="M1105 540 V741" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="1117" y="625" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="start">Recovery unavailable</text><text x="1117" y="646" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="start">or retries exhausted</text><rect x="435" y="741" width="385" height="78" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="773" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Deployment Agent</text><text x="627.5" y="800" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Simulates rollout of the build artifact</text><path d="M627 691 V741" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="641" y="723" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="start">Approved</text><rect x="40" y="741" width="312" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="196.0" y="773" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">PENDING_APPROVAL</text><text x="196.0" y="800" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Production rollout waits</text><path d="M435 677 H391 V718 H196 V741" stroke="#365e70" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="206" y="710" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="start">Approval required</text><rect x="435" y="842" width="385" height="78" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="874" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#193b4a" text-anchor="middle">Pipeline report</text><text x="627.5" y="901" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">pipeline_report.json</text><pa