<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- container -->
  <rect x="20" y="20" width="960" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#334155">Poridhi VM  ·  Docker container dl-augment:1.0 (CPU only)</text>

  <!-- raw data -->
  <rect x="45" y="80" width="190" height="370" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">Raw samples</text>
  <text x="140" y="126" font-size="12" text-anchor="middle" fill="#0c4a6e">make_samples.py</text>
  <rect x="65" y="150" width="150" height="60" rx="8" fill="#fff" stroke="#0284c7"/>
  <text x="140" y="175" font-size="13" text-anchor="middle" fill="#0f172a">4 digit scans</text>
  <text x="140" y="195" font-size="11" text-anchor="middle" fill="#475569">128×128 PNG</text>
  <rect x="65" y="240" width="150" height="60" rx="8" fill="#fff" stroke="#0284c7"/>
  <text x="140" y="265" font-size="13" text-anchor="middle" fill="#0f172a">1 voice note</text>
  <text x="140" y="285" font-size="11" text-anchor="middle" fill="#475569">2 s WAV, 16 kHz</text>
  <rect x="65" y="330" width="150" height="60" rx="8" fill="#fff" stroke="#0284c7"/>
  <text x="140" y="355" font-size="13" text-anchor="middle" fill="#0f172a">300 desk notes</text>
  <text x="140" y="375" font-size="11" text-anchor="middle" fill="#475569">+ BPE tokenizer</text>

  <!-- CV -->
  <rect x="290" y="140" width="330" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="455" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">CV · Albumentations 2.0.8</text>
  <text x="455" y="187" font-size="12" text-anchor="middle" fill="#334155">Rotate → BrightnessContrast</text>
  <text x="455" y="205" font-size="12" text-anchor="middle" fill="#334155">→ GaussNoise → CoarseDropout</text>

  <!-- Audio -->
  <rect x="290" y="230" width="330" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="455" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">Audio · torchaudio transforms</text>
  <text x="455" y="277" font-size="12" text-anchor="middle" fill="#334155">AddNoise · SpeedPerturbation · pitch shift</text>
  <text x="455" y="295" font-size="12" text-anchor="middle" fill="#334155">MelSpectrogram → TimeMasking · FrequencyMasking</text>

  <!-- NLP -->
  <rect x="290" y="320" width="330" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="455" y="346" font-size="14" font-weight="700" text-anchor="middle" fill="#166534">NLP · text aug + tokenizers</text>
  <text x="455" y="367" font-size="12" text-anchor="middle" fill="#334155">random deletion · random swap</text>
  <text x="455" y="385" font-size="12" text-anchor="middle" fill="#334155">→ ids, padding, truncation, attention mask</text>

  <!-- outputs -->
  <rect x="680" y="140" width="270" height="80" rx="10" fill="#fff" stroke="#7c3aed"/>
  <text x="815" y="172" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">cv_grid.png</text>
  <text x="815" y="194" font-size="12" text-anchor="middle" fill="#475569">original vs 5 augmented copies</text>
  <rect x="680" y="230" width="270" height="80" rx="10" fill="#fff" stroke="#d97706"/>
  <text x="815" y="262" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">audio_mels.png + 4 WAVs</text>
  <text x="815" y="284" font-size="12" text-anchor="middle" fill="#475569">mel-spectrogram before / after</text>
  <rect x="680" y="320" width="270" height="80" rx="10" fill="#fff" stroke="#16a34a"/>
  <text x="815" y="352" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">token ids + masks</text>
  <text x="815" y="374" font-size="12" text-anchor="middle" fill="#475569">every row the same length (9)</text>

  <!-- arrows -->
  <path d="M215,180 L290,180" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M215,270 L290,270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M215,360 L290,360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,180 L680,180" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,270 L680,270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M620,360 L680,360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- seed / repro -->
  <rect x="290" y="440" width="660" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="620" y="468" font-size="14" font-weight="700" text-anchor="middle" fill="#991b1b">check_repro.py · fixed seed</text>
  <text x="620" y="490" font-size="12" text-anchor="middle" fill="#334155">seed 42 twice → same SHA-256 · seed 7 → different SHA-256  (image, audio, text)</text>
  <path d="M455,400 L455,440" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="140" y="485" font-size="13" text-anchor="middle" fill="#334155">seed = 42</text>
  <path d="M190,480 L290,476" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
