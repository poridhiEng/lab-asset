<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- client -->
  <rect x="20" y="150" width="150" height="90" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="182" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Client</text>
  <text x="95" y="204" font-size="12" fill="#1e293b" text-anchor="middle">check_payloads.py</text>
  <text x="95" y="222" font-size="12" fill="#1e293b" text-anchor="middle">POST /predict (JSON)</text>

  <!-- API container -->
  <rect x="210" y="30" width="560" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="226" y="56" font-size="15" font-weight="700" fill="#0f172a">api.py (FastAPI, port 8000)</text>

  <rect x="230" y="150" width="160" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="310" y="176" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Layer 1: Pydantic</text>
  <text x="310" y="196" font-size="11" fill="#4c1d95" text-anchor="middle">ParcelScan schema</text>
  <text x="310" y="212" font-size="11" fill="#4c1d95" text-anchor="middle">fields, types, 0..16,</text>
  <text x="310" y="228" font-size="11" fill="#4c1d95" text-anchor="middle">no extra fields</text>

  <rect x="420" y="150" width="140" height="90" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="180" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Preprocess</text>
  <text x="490" y="202" font-size="11" fill="#78350f" text-anchor="middle">float32, / 16,</text>
  <text x="490" y="218" font-size="11" fill="#78350f" text-anchor="middle">shape (1, 1, rows, cols)</text>

  <rect x="590" y="150" width="160" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="670" y="176" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Layer 2: signature</text>
  <text x="670" y="196" font-size="11" fill="#0c4a6e" text-anchor="middle">pyfunc.predict checks</text>
  <text x="670" y="212" font-size="11" fill="#0c4a6e" text-anchor="middle">float32 tensor</text>
  <text x="670" y="228" font-size="11" fill="#0c4a6e" text-anchor="middle">(-1, 1, 8, 8)</text>

  <line x1="172" y1="195" x2="226" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="392" y1="195" x2="416" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="562" y1="195" x2="586" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- rejections -->
  <rect x="230" y="290" width="160" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="310" y="314" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">HTTP 422</text>
  <text x="310" y="332" font-size="11" fill="#7f1d1d" text-anchor="middle">field + rule + message</text>
  <line x1="310" y1="242" x2="310" y2="286" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>

  <rect x="590" y="290" width="160" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="670" y="314" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">HTTP 400</text>
  <text x="670" y="332" font-size="11" fill="#7f1d1d" text-anchor="middle">MLflow shape / dtype error</text>
  <line x1="670" y1="242" x2="670" y2="286" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>

  <rect x="590" y="70" width="160" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="92" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">HTTP 200</text>
  <text x="670" y="110" font-size="11" fill="#14532d" text-anchor="middle">digit + confidence</text>
  <line x1="670" y1="148" x2="670" y2="124" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>

  <!-- mlflow server -->
  <rect x="810" y="120" width="170" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="895" y="146" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">MLflow server</text>
  <text x="895" y="166" font-size="11" fill="#334155" text-anchor="middle">port 5000</text>
  <rect x="825" y="178" width="140" height="78" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="895" y="200" font-size="12" font-weight="700" fill="#0c4a6e" text-anchor="middle">dakseba-digits v1</text>
  <text x="895" y="220" font-size="11" fill="#0c4a6e" text-anchor="middle">MLmodel with the</text>
  <text x="895" y="236" font-size="11" fill="#0c4a6e" text-anchor="middle">hand-written signature</text>
  <line x1="823" y1="215" x2="754" y2="205" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="776" y="236" font-size="10" fill="#334155">loaded at</text>
  <text x="776" y="249" font-size="10" fill="#334155">start-up</text>

  <!-- train -->
  <rect x="810" y="320" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="895" y="344" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">train.py</text>
  <text x="895" y="364" font-size="11" fill="#1e3a8a" text-anchor="middle">log_model(signature=...)</text>
  <line x1="895" y1="318" x2="895" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <text x="20" y="420" font-size="12" fill="#334155">signature_check.py sends tensors straight to the model (no API) to show what the signature alone rejects: shape and dtype.</text>
  <text x="20" y="440" font-size="12" fill="#334155">All containers share the Docker network mlnet.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
