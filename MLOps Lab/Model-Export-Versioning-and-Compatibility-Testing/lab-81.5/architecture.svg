<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 475" width="1200" height="475" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="475" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title Banner -->
  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">DakSeba Automated CI Pipeline for Model Contract &amp; Smoke Promotion Gating</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#475569">GitHub Actions workflow (runnable via act v0.2.98) gates promotion using 5 inference contract tests and 4 smoke tests</text>

  <!-- Column Headers -->
  <text x="148" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">1. CANDIDATE ARTIFACTS</text>
  <text x="455" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">2. PYTEST COMPATIBILITY SUITES</text>
  <text x="765" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">3. CI PIPELINE &amp; PROMOTION GATE</text>
  <text x="1062" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">4. GATED OUTCOMES</text>

  <!-- Column 1: Candidate Artifacts -->
  <rect x="22" y="94" width="252" height="354" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="148" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">src/build_candidates.py</text>
  <text x="148" y="133" text-anchor="middle" font-size="10.5" fill="#475569">MLflow pyfunc exports + smoke_sample.npz</text>

  <rect x="36" y="146" width="224" height="62" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="148" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">baseline (active champion)</text>
  <text x="148" y="182" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#334155">(-1, 1, 8, 8) float32</text>
  <text x="148" y="198" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">test_acc = 0.9694 (floor)</text>

  <rect x="36" y="218" width="224" height="62" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="148" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">candidate-bad-contract</text>
  <text x="148" y="254" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#7f1d1d">(-1, 64) float64 FlatDigitMLP</text>
  <text x="148" y="270" text-anchor="middle" font-size="10" fill="#991b1b">Breaks dtype &amp; shape contract</text>

  <rect x="36" y="290" width="224" height="62" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="148" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">candidate-bad-smoke</text>
  <text x="148" y="326" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#78350f">(-1, 1, 8, 8) float32 (valid schema)</text>
  <text x="148" y="342" text-anchor="middle" font-size="10" fill="#92400e">test_acc = 0.1000 (untrained)</text>

  <rect x="36" y="362" width="224" height="68" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/>
  <text x="148" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">candidate-v2 (width=32)</text>
  <text x="148" y="398" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#14532d">(-1, 1, 8, 8) float32</text>
  <text x="148" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">test_acc = 0.9806</text>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="274" y1="210" x2="312" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="274" y1="345" x2="312" y2="345" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Column 2: Pytest Suites -->
  <rect x="317" y="94" width="276" height="172" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="455" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">tests/test_contract.py (5 tests)</text>
  <text x="455" y="137" text-anchor="middle" font-size="10.5" fill="#334155">1. Non-null MLflow ModelSignature</text>
  <text x="455" y="156" text-anchor="middle" font-size="10.5" fill="#334155">2. Matches (-1,1,8,8)-&gt;(-1,10) float32</text>
  <text x="455" y="175" text-anchor="middle" font-size="10.5" fill="#334155">3. Rejects float64 &amp; int64 dtypes</text>
  <text x="455" y="194" text-anchor="middle" font-size="10.5" fill="#334155">4. Dynamic batch b=1 vs b=16 parity</text>
  <text x="455" y="213" text-anchor="middle" font-size="10.5" fill="#334155">5. Rejects (4,64) &amp; (4,1,7,8) shapes</text>
  <text x="455" y="244" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">Enforces schema, dtype &amp; shape contract</text>

  <rect x="317" y="282" width="276" height="166" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="455" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#86198f">tests/test_smoke.py (4 tests)</text>
  <text x="455" y="326" text-anchor="middle" font-size="10.5" fill="#334155">1. Cold pyfunc load under 5.0s budget</text>
  <text x="455" y="346" text-anchor="middle" font-size="10.5" fill="#334155">2. Run 32-scan sample (finite logits)</text>
  <text x="455" y="366" text-anchor="middle" font-size="10.5" fill="#334155">3. Valid classes 0..9 &amp; softmax sum=1</text>
  <text x="455" y="386" text-anchor="middle" font-size="10.5" fill="#334155">4. Accuracy &gt;= active champion (0.9694)</text>
  <text x="455" y="424" text-anchor="middle" font-size="10" font-weight="600" fill="#701a75">Catches silent weight &amp; quality regressions</text>

  <!-- Arrows Col 2 -> Col 3 -->
  <line x1="593" y1="185" x2="629" y2="235" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="593" y1="360" x2="629" y2="305" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Column 3: CI Pipeline & Gate -->
  <rect x="634" y="126" width="262" height="290" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="765" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">CI Pipeline &amp; Promotion Gate</text>
  <text x="765" y="170" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#7c2d12">.github/workflows/</text>
  <text x="765" y="185" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#7c2d12">model-compatibility.yml</text>
  <line x1="652" y1="198" x2="878" y2="198" stroke="#fdba74" stroke-width="1"/>
  <text x="765" y="218" text-anchor="middle" font-size="10.5" fill="#334155">Triggers: push (main) &amp; workflow_dispatch</text>
  <text x="765" y="238" text-anchor="middle" font-size="10.5" fill="#334155">Runner: GitHub Actions / act v0.2.98</text>
  <text x="765" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Step 1: actions/checkout@v4</text>
  <text x="765" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Step 2: build_candidates.py</text>
  <text x="765" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Step 3: gate_promotion.py</text>
  <line x1="652" y1="316" x2="878" y2="316" stroke="#fdba74" stroke-width="1"/>
  <text x="765" y="338" text-anchor="middle" font-size="10.5" fill="#475569">pytest exit != 0 -&gt; BLOCKED (exit 1)</text>
  <text x="765" y="358" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="600">pytest exit == 0 -&gt; PROMOTED (exit 0)</text>
  <text x="765" y="392" text-anchor="middle" font-size="10" fill="#64748b">Logs outputs/gate_audit.json</text>

  <!-- Arrows Col 3 -> Col 4 -->
  <path d="M 896 225 C 920 225, 920 155, 942 155" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <line x1="896" y1="270" x2="942" y2="270" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <path d="M 896 325 C 920 325, 920 385, 942 385" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Column 4: Outcomes -->
  <rect x="947" y="102" width="230" height="98" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1062" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">candidate-bad-contract</text>
  <text x="1062" y="143" text-anchor="middle" font-size="10.5" fill="#7f1d1d">3 passed · 6 failed</text>
  <text x="1062" y="161" text-anchor="middle" font-size="10.5" fill="#334155">Active stays: baseline (0.9694)</text>
  <rect x="1002" y="169" width="120" height="22" rx="4" fill="#dc2626"/>
  <text x="1062" y="184" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">GATE: BLOCKED</text>

  <rect x="947" y="218" width="230" height="98" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1062" y="240" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">candidate-bad-smoke</text>
  <text x="1062" y="259" text-anchor="middle" font-size="10.5" fill="#7f1d1d">8 passed · 1 failed (acc 0.1000)</text>
  <text x="1062" y="277" text-anchor="middle" font-size="10.5" fill="#334155">Active stays: baseline (0.9694)</text>
  <rect x="1002" y="285" width="120" height="22" rx="4" fill="#dc2626"/>
  <text x="1062" y="300" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">GATE: BLOCKED</text>

  <rect x="947" y="334" width="230" height="106" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="1062" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">candidate-v2</text>
  <text x="1062" y="375" text-anchor="middle" font-size="10.5" fill="#166534">9 passed · 0 failed (5.53s)</text>
  <text x="1062" y="393" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">baseline -&gt; candidate-v2 (0.9806)</text>
  <rect x="996" y="403" width="132" height="24" rx="4" fill="#15803d"/>
  <text x="1062" y="419" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">GATE: PROMOTED</text>
</svg>
