<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2472" height="1210" viewBox="0 0 2472 1210" role="img" aria-labelledby="title desc">
<title id="title">Poridhi Lab 5.3: Pandera Validation Architecture</title>
<desc id="desc">Poridhi Lab 5.3 Pandera Validation architecture. Generate orders writes orders CSV; Pandera schema validates it, producing either valid orders or a failure report. A separate Self check, self_check.py, verifies the schema rules with an upward flow arrow. Includes embedded authentic Poridhi logo and footer, and matching 500 millisecond animated dashed arrow connections.</desc>
<defs>
  <style>
    .type {font-family:Arial, Helvetica, sans-serif;}
    .card-title {font-family:Arial, Helvetica, sans-serif;font-size:29px;font-weight:700;fill:#fff;}
    .card-sub {font-family:Arial, Helvetica, sans-serif;font-size:23px;fill:#fff;}
    .icon {fill:none;stroke:#fff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;}
    @keyframes poridhi-reference-flow { to { stroke-dashoffset:0; } }
    .poridhi-flow {fill:none;stroke:#424B63;stroke-width:3;stroke-dasharray:9 7;stroke-dashoffset:16;marker-end:url(#flowArrow);animation:poridhi-reference-flow 500ms linear infinite;stroke-linecap:butt;stroke-linejoin:round;}
    @media (prefers-reduced-motion:reduce) { .poridhi-flow {animation:none;stroke-dashoffset:0;} }
  </style>
  <marker id="flowArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M1 1L11 6L1 11Z" fill="#424B63"/>
  </marker>
