<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960"><title>Blue-green deployment and rollback</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365e70"/></marker></defs><rect width="1200" height="960" fill="white"/><rect x="310" y="18" width="580" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="600.0" y="48" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Release candidate and deployment policy</text><text x="600.0" y="73" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">config/deployment.json  ·  config/policy.json</text><path d="M600 90 V110 H333 V132" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M600 110 H867 V132" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="128" y="132" width="410" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="333.0" y="162" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Policy Agent</text><text x="333.0" y="187" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Assesses the candidate release</text><rect x="662" y="132" width="410" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="867.0" y="162" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Policy Engine</text><text x="867.0" y="187" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Evaluates deterministic policy rules</text><path d="M333 204 V224 H505 V246" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M867 204 V224 H695 V246" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="400" y="246" width="400" height="72" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="600.0" y="276" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Merge policy decisions</text><text x="600.0" y="301" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">The stricter decision wins</text><rect x="908" y="246" width="245" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="1030.5" y="276" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Blocked</text><text x="1030.5" y="301" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Blue stays active</text><path d="M800 282 H908" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="852" y="271" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Block</text><path d="M600 318 V364" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="746" y="346" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Proceed, with conditions if required</text><rect x="90" y="364" width="1020" height="200" rx="12" fill="#f4f9f9" stroke="#7798a5" stroke-width="1.6"/><text x="600" y="397" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#193b4a" text-anchor="middle">Deployment Agent</text><text x="600" y="426" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#193b4a" text-anchor="middle">The state machine provisions green and requests both checks.</text><rect x="115" y="458" width="465" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="347.5" y="488" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Health &amp; Smoke Validator</text><text x="347.5" y="513" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Checks green health and smoke-test results</text><rect x="620" y="458" width="465" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="852.5" y="488" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Contract &amp; Schema Validator</text><text x="852.5" y="513" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Checks green against published contracts</text><path d="M365 564 V630" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="455" y="598" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Both checks pass</text><path d="M835 564 V600 H930 V619" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="952" y="590" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#193b4a" text-anchor="middle">Hard validation failure</text><rect x="738" y="619" width="384" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="930.0" y="649" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Failure Recovery Agent</text><text x="930.0" y="674" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Diagnoses the failure and plans rollback</text><rect x="168" y="630" width="394" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="365.0" y="660" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Traffic-switch approval gate</text><text x="365.0" y="685" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Wait for approval when policy requires it</text><path d="M930 691 V721" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="738" y="721" width="384" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="930.0" y="751" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Rollback approval gate</text><text x="930.0" y="776" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Wait for approval when policy requires it</text><path d="M365 702 V817" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M930 793 V817" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="168" y="817" width="394" height="72" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="365.0" y="847" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Promote green</text><text x="365.0" y="872" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Send 100% of traffic to green and retire blue</text><rect x="738" y="817" width="384" height="72" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="930.0" y="847" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Restore blue</text><text x="930.0" y="872" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Return 100% of traffic to blue</text><text x="600" y="933" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#193b4a" text-anchor="middle">deployment_report.json records every outcome, state transition and final traffic split.</text></svg>