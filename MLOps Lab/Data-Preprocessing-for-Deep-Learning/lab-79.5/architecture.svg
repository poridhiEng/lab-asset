<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#334155">Poridhi VM  ·  Docker image dl-cache:1.0  ·  CPU only</text>

  <!-- raw data -->
  <rect x="50" y="80" width="230" height="100" rx="12" fill="#fff" stroke="#475569"/>
  <text x="165" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">data/  (make_data.py)</text>
  <text x="165" y="129" font-size="12" text-anchor="middle" fill="#334155">4,000 parcel labels · 384×384 PNG</text>
  <text x="165" y="147" font-size="12" text-anchor="middle" fill="#334155">labels.csv (notes) · tokenizer.json</text>
  <text x="165" y="165" font-size="12" text-anchor="middle" fill="#334155">657 MB</text>

  <!-- preprocess -->
  <rect x="385" y="80" width="230" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#5b21b6">preprocess.py</text>
  <text x="500" y="129" font-size="12" text-anchor="middle" fill="#334155">decode PNG → resize 64×64</text>
  <text x="500" y="147" font-size="12" text-anchor="middle" fill="#334155">normalize → tokenize (16 ids)</text>
  <text x="500" y="165" font-size="12" text-anchor="middle" fill="#334155">the costly part</text>

  <!-- shards -->
  <rect x="720" y="80" width="230" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="835" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">shards/  (write_shards.py)</text>
  <text x="835" y="129" font-size="12" text-anchor="middle" fill="#334155">WebDataset train-00000N.tar</text>
  <text x="835" y="147" font-size="12" text-anchor="middle" fill="#334155">1,000 samples per shard</text>
  <text x="835" y="165" font-size="12" text-anchor="middle" fill="#334155">img.npy · ids.npy · cls — 211 MB</text>

  <path d="M280,130 L385,130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M615,130 L720,130" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="667" y="120" font-size="12" text-anchor="middle" fill="#166534">once</text>

  <!-- two paths -->
  <rect x="160" y="250" width="290" height="100" rx="12" fill="#fee2e2" stroke="#dc2626"/>
  <text x="305" y="277" font-size="15" font-weight="700" text-anchor="middle" fill="#991b1b">raw path (every epoch)</text>
  <text x="305" y="299" font-size="12" text-anchor="middle" fill="#334155">RawParcels Dataset reads PNG + note</text>
  <text x="305" y="317" font-size="12" text-anchor="middle" fill="#334155">and runs preprocess() for every sample</text>

  <rect x="550" y="250" width="290" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="695" y="277" font-size="15" font-weight="700" text-anchor="middle" fill="#166534">cached path</text>
  <text x="695" y="299" font-size="12" text-anchor="middle" fill="#334155">wds.WebDataset reads the .tar shards</text>
  <text x="695" y="317" font-size="12" text-anchor="middle" fill="#334155">no decode, no resize, no tokenize</text>

  <path d="M165,180 L250,250" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500,180 L360,250" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M835,180 L740,250" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- training -->
  <rect x="300" y="400" width="400" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="500" y="425" font-size="15" font-weight="700" text-anchor="middle" fill="#075985">train_epoch.py  ·  same ParcelNet, seed, batch 64</text>
  <text x="500" y="446" font-size="12" text-anchor="middle" fill="#334155">epoch-1 time = waiting for data + training</text>
  <path d="M305,350 L420,400" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M695,350 L580,400" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="500" y="495" font-size="13" text-anchor="middle" fill="#334155">benchmark.py: 3 runs each, raw vs shards  ·  check_cache.py: cached sample == fresh sample (SHA-256)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
