<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#0f172a">Without overlap: the model waits for every batch</text>
  <g font-size="12" fill="#fff">
    <rect x="140" y="56" width="150" height="34" fill="#dc2626"/><text x="215" y="78" text-anchor="middle">load batch 1</text>
    <rect x="290" y="56" width="60" height="34" fill="#2563eb"/><text x="320" y="78" text-anchor="middle">train 1</text>
    <rect x="350" y="56" width="150" height="34" fill="#dc2626"/><text x="425" y="78" text-anchor="middle">load batch 2</text>
    <rect x="500" y="56" width="60" height="34" fill="#2563eb"/><text x="530" y="78" text-anchor="middle">train 2</text>
    <rect x="560" y="56" width="150" height="34" fill="#dc2626"/><text x="635" y="78" text-anchor="middle">load batch 3</text>
    <rect x="710" y="56" width="60" height="34" fill="#2563eb"/><text x="740" y="78" text-anchor="middle">train 3</text>
  </g>
  <text x="30" y="78" font-size="13" fill="#334155">num_workers=0</text>

  <text x="30" y="140" font-size="17" font-weight="700" fill="#0f172a">With 2 workers + prefetch: batches are ready before the model asks</text>
  <g font-size="12" fill="#fff">
    <rect x="140" y="160" width="150" height="30" fill="#dc2626"/><text x="215" y="180" text-anchor="middle">worker 1: batch 1</text>
    <rect x="290" y="160" width="150" height="30" fill="#dc2626"/><text x="365" y="180" text-anchor="middle">worker 1: batch 3</text>
    <rect x="440" y="160" width="150" height="30" fill="#dc2626"/><text x="515" y="180" text-anchor="middle">worker 1: batch 5</text>
    <rect x="140" y="196" width="150" height="30" fill="#f97316"/><text x="215" y="216" text-anchor="middle">worker 2: batch 2</text>
    <rect x="290" y="196" width="150" height="30" fill="#f97316"/><text x="365" y="216" text-anchor="middle">worker 2: batch 4</text>
    <rect x="440" y="196" width="150" height="30" fill="#f97316"/><text x="515" y="216" text-anchor="middle">worker 2: batch 6</text>
    <rect x="290" y="232" width="60" height="30" fill="#2563eb"/><text x="320" y="252" text-anchor="middle">train 1</text>
    <rect x="352" y="232" width="60" height="30" fill="#2563eb"/><text x="382" y="252" text-anchor="middle">train 2</text>
    <rect x="440" y="232" width="60" height="30" fill="#2563eb"/><text x="470" y="252" text-anchor="middle">train 3</text>
    <rect x="502" y="232" width="60" height="30" fill="#2563eb"/><text x="532" y="252" text-anchor="middle">train 4</text>
  </g>
  <text x="30" y="216" font-size="13" fill="#334155">num_workers=2</text>
  <text x="620" y="252" font-size="12" fill="#334155">prefetch_factor = batches each worker keeps ready</text>

  <!-- where it runs -->
  <rect x="30" y="300" width="455" height="230" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="50" y="328" font-size="15" font-weight="700" fill="#0f172a">Poridhi VM (this lab, CPU)</text>
  <text x="50" y="352" font-size="12" fill="#334155">Docker image dl-stream:1.0 · 2 vCPUs = 1 physical core</text>
  <text x="50" y="378" font-size="13" fill="#1e293b">torch_loader.py — DataLoader sweep</text>
  <text x="66" y="398" font-size="12" fill="#334155">num_workers 0 / 1 / 2 / 4 × prefetch_factor 2 / 4</text>
  <text x="50" y="424" font-size="13" fill="#1e293b">tf_pipeline.py — tf.data built step by step</text>
  <text x="66" y="444" font-size="12" fill="#334155">map → parallel map → prefetch → cache</text>
  <text x="50" y="470" font-size="13" fill="#1e293b">measures: epoch time · time waiting for data · samples/s</text>
  <text x="50" y="496" font-size="12" fill="#334155">same 2,000 DakSeba parcels (384×384 PNG + note)</text>

  <rect x="515" y="300" width="455" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="535" y="328" font-size="15" font-weight="700" fill="#166534">Kaggle notebook (GPU part)</text>
  <text x="535" y="352" font-size="12" fill="#334155">NVIDIA GPU + more CPU cores</text>
  <text x="535" y="378" font-size="13" fill="#1e293b">gpu_loader.py — same dataset, wider model on GPU</text>
  <text x="551" y="398" font-size="12" fill="#334155">num_workers 0 / 1 / 2 / 4 · pin_memory off / on</text>
  <text x="535" y="424" font-size="13" fill="#1e293b">nvidia-smi sampled every 100 ms</text>
  <text x="551" y="444" font-size="12" fill="#334155">→ average GPU utilization per setting</text>
  <text x="535" y="470" font-size="13" fill="#1e293b">finds the worker count that keeps the GPU busy</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
