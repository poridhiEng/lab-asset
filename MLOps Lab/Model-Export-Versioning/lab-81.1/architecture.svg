<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#ffffff"/>

  <!-- client container -->
  <rect x="20" y="20" width="430" height="500" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="36" y="46" font-size="15" font-weight="700" fill="#0f172a">Client container (dl-mlflow:1.0, alias dr)</text>

  <rect x="40" y="66" width="390" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="235" y="92" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">train.py</text>
  <text x="235" y="114" font-size="12" fill="#1e3a8a" text-anchor="middle">DigitNet on 8x8 digit scans, --lr --epochs --width --data-version</text>

  <rect x="40" y="160" width="185" height="78" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="132" y="184" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Native export</text>
  <text x="132" y="204" font-size="12" fill="#78350f" text-anchor="middle">torch.save(state_dict)</text>
  <text x="132" y="222" font-size="12" fill="#78350f" text-anchor="middle">-> log_artifact(native/)</text>

  <rect x="245" y="160" width="185" height="78" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="337" y="184" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">MLflow model</text>
  <text x="337" y="204" font-size="12" fill="#78350f" text-anchor="middle">infer_signature(x, y)</text>
  <text x="337" y="222" font-size="12" fill="#78350f" text-anchor="middle">-> pytorch.log_model</text>

  <line x1="160" y1="130" x2="140" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="130" x2="330" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="268" width="390" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="235" y="290" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">set_model_version_tag</text>
  <text x="235" y="308" font-size="12" fill="#4c1d95" text-anchor="middle">data_version, lr, epochs, width, val_acc, framework, native_file</text>

  <rect x="40" y="350" width="185" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="132" y="376" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">list_versions.py</text>
  <text x="132" y="396" font-size="12" fill="#14532d" text-anchor="middle">search_model_versions</text>

  <rect x="245" y="350" width="185" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="337" y="376" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">reload_check.py</text>
  <text x="337" y="396" font-size="12" fill="#14532d" text-anchor="middle">pytorch / pyfunc / torch.load</text>

  <text x="40" y="450" font-size="12" fill="#334155">MLFLOW_TRACKING_URI=http://mlflow:5000</text>
  <text x="40" y="470" font-size="12" fill="#334155">Both containers share the Docker network mlnet.</text>

  <!-- server -->
  <rect x="540" y="20" width="440" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="556" y="46" font-size="15" font-weight="700" fill="#0f172a">MLflow server container (port 5000)</text>

  <rect x="560" y="66" width="400" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="760" y="90" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Tracking: experiment dakseba-digits</text>
  <text x="760" y="110" font-size="12" fill="#0c4a6e" text-anchor="middle">runs with params + val_acc, train_loss per epoch</text>

  <rect x="560" y="138" width="400" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="760" y="162" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Model Registry: dakseba-digits</text>
  <text x="760" y="184" font-size="12" fill="#0c4a6e" text-anchor="middle">version 1  |  version 2  |  version 3</text>
  <text x="760" y="204" font-size="12" fill="#0c4a6e" text-anchor="middle">each version = one LoggedModel + its tags</text>

  <rect x="560" y="234" width="195" height="96" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="657" y="258" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">mlflow.db (SQLite)</text>
  <text x="657" y="280" font-size="12" fill="#1e293b" text-anchor="middle">runs, params, metrics,</text>
  <text x="657" y="298" font-size="12" fill="#1e293b" text-anchor="middle">versions, tags</text>

  <rect x="765" y="234" width="195" height="96" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="862" y="258" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">artifacts/</text>
  <text x="862" y="280" font-size="12" fill="#1e293b" text-anchor="middle">MLmodel (signature),</text>
  <text x="862" y="298" font-size="12" fill="#1e293b" text-anchor="middle">data/, requirements.txt,</text>
  <text x="862" y="316" font-size="12" fill="#1e293b" text-anchor="middle">native/digitnet_*.pt</text>

  <line x1="432" y1="200" x2="556" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="432" y1="293" x2="556" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M558,214 L470,334 L132,334 L132,346" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M337,334 L337,346" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="326" font-size="11" fill="#14532d">read</text>
  <text x="462" y="160" font-size="11" fill="#334155">log + register</text>

  <!-- UI -->
  <rect x="560" y="400" width="400" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="760" y="426" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">MLflow UI in the browser</text>
  <text x="760" y="446" font-size="12" fill="#14532d" text-anchor="middle">https://&lt;your VS Code host&gt;/proxy/5000/</text>
  <text x="760" y="466" font-size="12" fill="#14532d" text-anchor="middle">runs list, model versions with tags, schema</text>
  <line x1="760" y1="352" x2="760" y2="396" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
