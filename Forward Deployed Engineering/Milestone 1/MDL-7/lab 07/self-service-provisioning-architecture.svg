<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030"><title>Self-service infrastructure provisioning</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#365e70"/></marker></defs><rect width="1200" height="1030" fill="white"/><rect x="36" y="24" width="310" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="191.0" y="54" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Self-service request</text><text x="191.0" y="79" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">requests/*.json</text><rect x="415" y="24" width="370" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="600.0" y="54" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Provisioning orchestrator</text><text x="600.0" y="79" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">scripts/provision.py</text><rect x="855" y="24" width="309" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1009.5" y="54" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">GitHub Actions</text><text x="1009.5" y="79" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Provisioning workflow</text><path d="M346 60 H415" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M855 60 H785" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M600 96 V134" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="415" y="134" width="370" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="600.0" y="164" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Infrastructure Agent</text><text x="600.0" y="189" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Generates Terraform configuration (HCL)</text><path d="M600 206 V244" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="415" y="244" width="370" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="600.0" y="274" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Plan generation</text><text x="600.0" y="299" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Simulator converts HCL to plan JSON</text><path d="M600 316 V336 H235 V364" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M600 336 V364" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="38" y="364" width="394" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="235.0" y="394" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Plan Validator Agent</text><text x="235.0" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Records advisory risk findings in the report</text><rect x="460" y="364" width="335" height="72" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="627.5" y="394" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Policy Engine</text><text x="627.5" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Enforces rules against the plan</text><rect x="882" y="364" width="282" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1023.0" y="394" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Organisation policy</text><text x="1023.0" y="419" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">config/policy.json</text><path d="M882 400 H795" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M627 436 V482" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="664" y="466" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Allow</text><path d="M750 436 V460 H1040 V482" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="957" y="454" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Block</text><rect x="452" y="482" width="350" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="627.0" y="512" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Apply approval gate</text><text x="627.0" y="537" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Requires recorded human approval</text><rect x="904" y="482" width="260" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="1034.0" y="512" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Blocked by policy</text><text x="1034.0" y="537" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Apply stops</text><rect x="42" y="482" width="285" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="184.5" y="512" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Pending approval</text><text x="184.5" y="537" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Apply waits</text><path d="M452 518 H327" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="390" y="511" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Missing</text><path d="M627 554 V600" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="679" y="582" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Approved</text><rect x="452" y="600" width="350" height="72" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="627.0" y="630" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Terraform apply</text><text x="627.0" y="655" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Simulated in the reference lab</text><rect x="42" y="600" width="285" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="184.5" y="630" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Environment ready</text><text x="184.5" y="655" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Simulated apply succeeded</text><path d="M452 636 H327" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="390" y="628" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Success</text><path d="M627 672 V710" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><text x="662" y="697" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#193b4a" text-anchor="middle">Failure</text><rect x="452" y="710" width="350" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="627.0" y="740" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Failure Analysis Agent</text><text x="627.0" y="765" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Diagnoses the apply error</text><rect x="858" y="710" width="305" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1010.5" y="740" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Remediation Agent</text><text x="1010.5" y="765" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Proposes a configuration fix</text><path d="M802 746 H858" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><path d="M1010 782 V828" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="835" y="828" width="348" height="72" rx="12" fill="#f0f6fa" stroke="#7798a5" stroke-width="1.6"/><text x="1009.0" y="858" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Remediation approval</text><text x="1009.0" y="883" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Records approval or pending status</text><rect x="320" y="828" width="409" height="72" rx="12" fill="white" stroke="#7798a5" stroke-width="1.6"/><text x="524.5" y="858" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">Remediation proposal</text><text x="524.5" y="883" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Fix and decision are recorded for review</text><path d="M835 864 H729" fill="none" stroke="#365e70" stroke-width="2.3" marker-end="url(#a)"/><rect x="36" y="937" width="1128" height="68" rx="12" fill="#e6f3f1" stroke="#7798a5" stroke-width="1.6"/><text x="600" y="966" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#193b4a" text-anchor="middle">provisioning_report.json</text><text x="600" y="991" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#193b4a" text-anchor="middle">Records risk findings, policy and approval decisions, the apply outcome and any proposed fix.</text></svg>